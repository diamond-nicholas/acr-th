name: CI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Run repository tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUN_LIVE_ACR_TESTS: "false"
      RUN_PRIVATE_ACR_TESTS: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve runtime config from prod.tfvars
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          path = Path('prod.tfvars')
          values = {}
          for raw in path.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = [part.strip() for part in raw.split('=', 1)]
              value = value.strip()
              if value.startswith('"') and value.endswith('"'):
                  parsed = ast.literal_eval(value)
              elif value.lower() == 'true':
                  parsed = True
              elif value.lower() == 'false':
                  parsed = False
              elif value.startswith('[') and value.endswith(']'):
                  parsed = ast.literal_eval(value.replace('true', 'True').replace('false', 'False'))
              elif value.isdigit() or (value.startswith('-') and value[1:].isdigit()):
                  parsed = int(value)
              else:
                  parsed = value.strip('"')
              values[key] = parsed

          github_env = os.environ['GITHUB_ENV']
          with open(github_env, 'a', encoding='utf-8') as fh:
              fh.write(f"AZURE_SUBSCRIPTION_ID={os.environ.get('AZURE_SUBSCRIPTION_ID', values.get('subscription_id', ''))}\n")
              fh.write(f"AZURE_TENANT_ID={os.environ.get('AZURE_TENANT_ID', values.get('tenant_id', ''))}\n")
              fh.write(f"ACR_NAME={os.environ.get('ACR_NAME', values.get('acr_name', ''))}\n")
              fh.write(f"RESOURCE_GROUP={os.environ.get('RESOURCE_GROUP', values.get('resource_group_name', ''))}\n")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run pytest
        shell: bash
        run: |
          python -m pytest -q tests
