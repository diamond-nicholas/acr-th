name: ACR push smoke test

on:
  workflow_dispatch:

jobs:
  acr-push:
    name: Verify ACR import flow from self-hosted runner
    runs-on: [self-hosted, linux, x64]
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: westeuropeprodacr01
      SOURCE_IMAGE: mcr.microsoft.com/azurelinux/base/core:3.0
      TARGET_IMAGE: base/azurelinux:3.0
      EXPECTED_DIGEST: sha256:1324a2cf7ed34e5f48a1022816b205782b86c7305651658e611dcd3d30756751
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm imported digest matches pinned value
        shell: bash
        run: |
          set -euo pipefail
          digest="$(az acr repository show --name "$ACR_NAME" --image "base/azurelinux:3.0" --query digest -o tsv)"
          echo "Observed digest: $digest"
          echo "Expected digest: $EXPECTED_DIGEST"
          if [[ "$digest" != "$EXPECTED_DIGEST" ]]; then
            echo "Pinned digest mismatch" >&2
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          python3 -m pip install -r tests/requirements.txt
          python3 -m pytest -q tests
