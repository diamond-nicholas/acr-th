name: ACR push smoke test

on:
  workflow_dispatch:

jobs:
  acr-push:
    name: Verify ACR import flow from self-hosted runner
    runs-on: [self-hosted, linux, x64]
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: eastusprodacr01
      RESOURCE_GROUP: rg-acr-prod-eastus
      SOURCE_IMAGE: mcr.microsoft.com/azurelinux/base/core:3.0
      TARGET_IMAGE: base/azurelinux:3.0
      EXPECTED_DIGEST: sha256:1324a2cf7ed34e5f48a1022816b205782b86c7305651658e611dcd3d30756751
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      RUN_LIVE_ACR_TESTS: "true"
      RUN_PRIVATE_ACR_TESTS: "true"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete stale imported image if it exists
        shell: bash
        run: |
          set -euo pipefail
          if az acr repository show --name "$ACR_NAME" --image "$TARGET_IMAGE" --query "imageId" -o tsv >/dev/null 2>&1; then
            echo "Previous import already exists; deleting stale tag before re-import."
            az acr repository delete --name "$ACR_NAME" --image "$TARGET_IMAGE" --yes || true
          fi

      - name: Import pinned base image into ACR
        shell: bash
        run: |
          set -euo pipefail
          export ARM_SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID}"
          export AZURE_CLIENT_ID="${AZURE_CLIENT_ID}"
          export AZURE_TENANT_ID="${AZURE_TENANT_ID}"
          export ACR_NAME="${ACR_NAME}"
          export SOURCE_IMAGE="${SOURCE_IMAGE}"
          export TARGET_IMAGE="${TARGET_IMAGE}"
          export FORCE="false"
          bash scripts/import-base-image.sh

      - name: Confirm imported digest matches pinned value
        shell: bash
        run: |
          set -euo pipefail
          digest="$(az acr repository show --name "$ACR_NAME" --image "$TARGET_IMAGE" --query digest -o tsv)"
          echo "Observed digest: $digest"
          echo "Expected digest: $EXPECTED_DIGEST"
          if [[ "$digest" != "$EXPECTED_DIGEST" ]]; then
            echo "Pinned digest mismatch for $ACR_NAME/$TARGET_IMAGE" >&2
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
          python -m pytest -q tests

      - name: Delete imported image after successful validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          az acr repository delete --name "$ACR_NAME" --image "$TARGET_IMAGE" --yes || echo "Cleanup skipped: image was already absent."
