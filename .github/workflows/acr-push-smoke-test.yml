name: ACR push smoke test

on:
  workflow_dispatch:

jobs:
  acr-push:
    name: Verify ACR import flow from self-hosted runner
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: westeuropeprodacr01
      SOURCE_IMAGE: mcr.microsoft.com/azurelinux/base/core:3.0
      TARGET_IMAGE: base/azurelinux:3.0
      FORCE: "false"
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run ACR import script
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/import-base-image.sh

      - name: Confirm imported tag exists
        shell: bash
        run: |
          set -euo pipefail
          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "base/azurelinux" \
            --top 10
